services:
    mysql:
        image: 'mysql:8.0'
        ports:
            - '3310:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'pakistan-db-mysql:/var/lib/mysql'
        networks:
            - pakistan-db
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s

networks:
    pakistan-db:
        driver: bridge

volumes:
    pakistan-db-mysql:
        driver: local
