services:
    mysql:
        image: 'mysql:8.0'
        ports:
            - '3310:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'pakistan-db-mysql:/var/lib/mysql'
        networks:
            - pakistan-db
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s

    # Mailpit — local SMTP catcher that renders outgoing emails in a web UI.
    # Opt-in: `docker compose --profile mail up -d` (so it doesn't collide if
    # you already run Mailpit from another project). Web UI: http://localhost:8025
    mailpit:
        image: 'axllent/mailpit:latest'
        profiles: ['mail']
        ports:
            - '1025:1025'
            - '8025:8025'
        environment:
            MP_MAX_MESSAGES: 500
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1
        networks:
            - pakistan-db

networks:
    pakistan-db:
        driver: bridge

volumes:
    pakistan-db-mysql:
        driver: local
